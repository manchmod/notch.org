<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greg Notch</title>
  <meta name="description" content="Greg Notch — CTO, builder, writer.">
  <meta property="og:title" content="Greg Notch">
  <meta property="og:description" content="Greg Notch — CTO, builder, writer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://notch.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #002b36;
      color: #839496;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 480px;
      padding: 2rem;
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #073642;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #268bd2;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 700;
    }

    h1 {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #eee8d5;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.9rem;
      color: #586e75;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .links a {
      display: block;
      padding: 0.75rem 1.5rem;
      border: 1px solid #073642;
      border-radius: 4px;
      color: #93a1a1;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s ease;
      letter-spacing: 0.02em;
    }

    .links a:hover {
      border-color: #268bd2;
      color: #268bd2;
      background: #073642;
    }

    .links a .label {
      color: #586e75;
      font-size: 0.75rem;
      font-weight: 400;
      display: block;
      margin-top: 0.2rem;
    }

    .links a:hover .label {
      color: #2aa198;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.7rem;
      color: #586e7580;
    }

    @media (max-width: 480px) {
      .container { padding: 1.5rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">GN</div>
    <h1>Greg Notch</h1>
    <p class="tagline"><!-- TODO: tagline --></p>

    <div class="links">
      <a href="https://blog.notch.org">
        Blog
        <span class="label">Security, AI, and building things</span>
      </a>
      <a href="https://github.com/manchmod">
        GitHub
        <span class="label">manchmod</span>
      </a>
      <a href="https://linkedin.com/in/gregnotch">
        LinkedIn
        <span class="label">greg notch</span>
      </a>
    </div>

    <p class="footer">notch.org</p>
  </div>
</body>
</html>
